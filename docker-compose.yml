
services:
  postgres:
    image: postgres:16-alpine
    container_name: spot-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: spot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: spot

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - spot_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spot -d spot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  spot_postgres_data:
